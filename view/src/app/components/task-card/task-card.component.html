<article class="card" [attr.data-priority]="task.priority">
  <!-- Card header -->
  <div class="card__header">
    <span class="card__tag">
      <span class="card__tag-icon">{{ tagIcon }}</span>
      {{ tagLabel }}
    </span>
    <div class="card__actions">
      <button class="card__action-btn" title="Edit task" (click)="onEdit($event)" aria-label="Edit task">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
      <button class="card__action-btn card__action-btn--danger" title="Delete task"
              (click)="onDelete($event)" aria-label="Delete task">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Title -->
  <h3 class="card__title">{{ task.title }}</h3>

  <!-- Description -->
  @if (task.description) {
    <p class="card__desc">{{ task.description }}</p>
  }

  <!-- Footer -->
  <div class="card__footer">
    <span class="card__priority" [attr.data-priority]="task.priority">{{ priorityLabel }}</span>
  </div>
</article>
